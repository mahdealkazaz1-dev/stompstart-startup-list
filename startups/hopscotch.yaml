name: Hopscotch
tagline: Unified API gateway for over 500 AI models
description: >-
  Hopscotch provides a single API gateway for developers to connect with over
  500 language and multimodal AI models from providers including OpenAI,
  Anthropic, Google, DeepSeek and Meta. The platform lets teams configure
  intelligent routing, manage per-key budget limits, inspect request activity,
  and pay provider list prices with no markup.
